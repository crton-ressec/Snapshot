name: Build Unsigned IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build iOS Unsigned IPA
    runs-on: macos-14
    timeout-minutes: 50

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Generate app icons
        run: node scripts/generate-icon.js

      - name: Verify icons
        run: ls -la assets/

      - name: Prebuild iOS
        run: npx expo prebuild --platform ios --clean
        env:
          EXPO_NO_TELEMETRY: 1

      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update

      - name: List schemes (debug)
        run: |
          cd ios
          xcodebuild -list -workspace Snapshot.xcworkspace || true

      - name: Build (unsigned)
        run: |
          cd ios
          set -o pipefail
          xcodebuild \
            -workspace Snapshot.xcworkspace \
            -scheme Snapshot \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/DerivedData" \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            build 2>&1 | tee xcodebuild.log

      - name: Package IPA
        run: |
          cd ios
          APP_PATH=$(find DerivedData -name "Snapshot.app" -type d | head -1)
          echo "Found app: $APP_PATH"
          if [ -z "$APP_PATH" ]; then
            echo "=== xcodebuild.log (last 200 lines) ==="
            tail -200 xcodebuild.log || true
            echo "=== DerivedData tree ==="
            find DerivedData -maxdepth 5 -type d || true
            exit 1
          fi
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -qr Snapshot-unsigned.ipa Payload
          mkdir -p ../artifacts
          mv Snapshot-unsigned.ipa ../artifacts/
          ls -lh ../artifacts/

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Snapshot-unsigned-ipa
          path: artifacts/Snapshot-unsigned.ipa
          retention-days: 30

      - name: Done
        run: echo "✅ Unsigned IPA built successfully"
