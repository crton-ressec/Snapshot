name: Build Unsigned IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build iOS Unsigned IPA
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Generate app icons
        run: node scripts/generate-icon.js

      - name: Verify icons exist
        run: ls -la assets/ && file assets/icon.png

      - name: Prebuild iOS
        run: npx expo prebuild --platform ios --clean
        env:
          EXPO_NO_TELEMETRY: 1

      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update

      - name: Build unsigned archive
        run: |
          cd ios
          xcodebuild \
            -workspace Snapshot.xcworkspace \
            -scheme Snapshot \
            -configuration Release \
            -sdk iphoneos \
            -archivePath $PWD/build/Snapshot.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            archive

      - name: Package IPA
        run: |
          cd ios
          mkdir -p Payload
          APP_PATH=$(find build -name "Snapshot.app" -type d | head -1)
          echo "Found app at: $APP_PATH"
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: Snapshot.app not found"
            find build -type d || true
            exit 1
          fi
          cp -r "$APP_PATH" Payload/
          zip -r Snapshot-unsigned.ipa Payload
          mkdir -p ../artifacts
          mv Snapshot-unsigned.ipa ../artifacts/
          ls -lh ../artifacts/

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Snapshot-unsigned-ipa
          path: artifacts/Snapshot-unsigned.ipa
          retention-days: 14

      - name: Done
        run: echo "IPA built successfully"
